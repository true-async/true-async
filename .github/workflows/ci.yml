name: CI

# Lanes and gates: dev/plans/S2.md, sections 2, 3 and 5.

on:
  push:
    branches: [main]
  pull_request:
  # No scheduled run (Edmond, 2026-10-12 16:22): the seeds run in a run dispatched by hand.
  workflow_dispatch:

# The workflow only reads the repository; no job needs a write token.
permissions:
  contents: read

env:
  # async-core-io in true-async/php-src and ior, as pinned in dev/WORKFLOW.md ("Pinned core").
  CORE_REF: 77ddd91c4b64b7f7d6c3f9103f200b0d2014e463
  IOR_REF: d46649f642506c46e649d7470f756be31fce99f8

jobs:
  windows:
    # As php-src's own WINDOWS job for PHP 8.6+ (.github/matrix.php): the whole PHP is built with
    # the extension copied into ext/true_async (dev/plans/S2.md, section 1).
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    env:
      PHP_BUILD_CACHE_BASE_DIR: C:\build-cache
      PHP_BUILD_OBJ_DIR: C:\obj
      PHP_BUILD_CACHE_SDK_DIR: C:\build-cache\sdk
      PHP_BUILD_SDK_BRANCH: php-sdk-2.8.4
      PHP_BUILD_CRT: vs18
      PLATFORM: x64
      THREAD_SAFE: '1'
      INTRINSICS: AVX2
      ADD_CONF: --enable-true-async=shared --enable-true-async-test-hooks=yes
    steps:
      - name: git config
        run: git config --global core.autocrlf false && git config --global core.eol lf

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: true-async

      - uses: actions/checkout@v5
        with:
          repository: true-async/php-src
          ref: ${{ env.CORE_REF }}
          persist-credentials: false
          path: php-src

      - name: Copy the extension into ext/true_async
        shell: pwsh
        run: |
          robocopy true-async php-src\ext\true_async /E /XD .git .github _build results /NFL /NDL /NJH /NJS
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Build ior
        uses: ./php-src/.github/actions/build-ior-windows
        with:
          ref: ${{ env.IOR_REF }}
          arch: x64

      - name: Build
        working-directory: php-src
        shell: cmd
        run: .github\scripts\windows\build.bat

      - name: Probe
        working-directory: true-async
        shell: cmd
        run: |
          for /d %%d in (C:\build-cache\deps-*) do copy /y %%d\bin\*.dll C:\obj\Release_TS\ > nul
          C:\obj\Release_TS\php.exe -n diag\ops.php
          cd ..\php-src
          C:\obj\Release_TS\php.exe -n run-tests.php -p C:\obj\Release_TS\php.exe -n -q --show-diff ext\standard\tests\streams\hooks
          exit 0
